<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a9e5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d7a44;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon background -->
  <rect x="0" y="5" width="50" height="50" rx="10" fill="url(#grad1)"/>
  <!-- Dollar sign -->
  <text x="25" y="38" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">$</text>
  <!-- Small chart bars inside icon -->
  <rect x="8" y="42" width="5" height="8" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="15" y="38" width="5" height="12" rx="1" fill="rgba(255,255,255,0.5)"/>
  <!-- App name -->
  <text x="62" y="28" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#1a9e5c" letter-spacing="-0.5">CashFlow</text>
  <text x="62" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" letter-spacing="2">P R O</text>
  <!-- Accent line -->
  <rect x="62" y="32" width="95" height="2" rx="1" fill="url(#grad2)"/>
</svg>
